name: Sync with GitLab
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, closed, reopened]
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Sync with GitLab
        uses: iamvikshan/gitsync@v1.1.3
        with:
          GITLAB_TOKEN: ${{ secrets.GITLAB_PASSWORD }}
          GH_TOKEN: ${{ secrets.GHUB_PASSWORD }}
